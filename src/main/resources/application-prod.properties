# =====================================================================
# Profil prod : SPRING_PROFILES_ACTIVE=prod
# Variables d'environnement obligatoires : DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ORIGINS
# =====================================================================

# Le schéma n'est jamais modifié par Hibernate : il est seulement vérifié au démarrage.
# (Évolution : gérer les migrations avec Flyway.)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Pas de valeur par défaut en production : une variable manquante bloque le démarrage.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
app.cors.allowed-origins=${CORS_ORIGINS}

logging.level.root=WARN
logging.level.fr.eric.mobilhomy=INFO
logging.level.org.springframework.security=WARN
