spring.application.name=MobilHomyServer

# =====================================================================
# Configuration commune à tous les profils.
# Aucun secret ici : ils viennent de variables d'environnement, ou en local
# du fichier .env à la racine du projet (non versionné, modèle : .env.example).
# Profils : dev (par défaut), prod (SPRING_PROFILES_ACTIVE=prod), test (tests).
# =====================================================================
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]

# Base de données
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=MOBILHOMY;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

# JWT : secret encodé en Base64, 32 octets minimum (HS256). Pas de valeur par défaut :
# l'application refuse de démarrer sans secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS : origines autorisées à appeler l'API (front Angular), séparées par des virgules
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Chemin relatif à la racine du projet ou absolu (ex: C:/mobilhomy/uploads/)
file.upload-dir=${UPLOAD_DIR:uploads/images/}

# Upload des photos de mobil-homes (POST /api/owner/images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Documentation de l'API (Swagger UI) : désactivée par défaut, activée par le profil dev
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Jamais de pile d'appels dans les réponses d'erreur
server.error.include-stacktrace=never
