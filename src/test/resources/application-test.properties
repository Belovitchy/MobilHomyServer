# Profil "test" : base H2 en mémoire à la place de SQL Server (tests d'intégration).
# Surcharge uniquement ces clés ; le reste vient de src/main/resources/application.properties.
spring.datasource.url=jdbc:h2:mem:mobilhomy-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
logging.level.org.springframework.security=WARN

# Secret réservé aux tests (aucune valeur réelle) : Base64, 32 octets
app.jwt.secret=dGVzdC1vbmx5LXNlY3JldC1tb2JpbGhvbXktMzJieXRlcyE=
app.cors.allowed-origins=http://localhost:4200
file.upload-dir=build/test-uploads/images/
